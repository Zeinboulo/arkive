[package]
name = "arkive-core"
description = "Core archive engine for Arkive: ZIP, 7z, TAR (gz/bz2/xz/zst), RAR extraction, AES-256, parallel compression, repair and benchmarking."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

zip = { version = "2.2", default-features = false, features = ["aes-crypto", "deflate", "bzip2", "zstd", "time"] }
sevenz-rust = { version = "0.6", features = ["aes256", "compress"] }
unrar = "0.5"
tar = "0.4"
flate2 = "1"
bzip2 = "0.4"
xz2 = "0.1"
zstd = { version = "0.13", features = ["zstdmt"] }
lz4_flex = "0.11"
rayon = "1"
walkdir = "2"
crc32fast = "1"
time = "0.3"
filetime = "0.2"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
